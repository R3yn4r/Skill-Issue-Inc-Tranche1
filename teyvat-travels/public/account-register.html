<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Teyvat Travels</title></head>
<body style="max-width:480px;margin:4rem auto;padding:1.5rem;font-family:system-ui">
  <h1>Create an account</h1>
  <p data-register-alert role="alert"></p>
  <form id="account-register-form">
    <p><label>Name<br><input name="name" required maxlength="100"></label></p>
    <p><label>Email<br><input name="email" type="email" required maxlength="190"></label></p>
    <p><label>Password<br><input name="password" type="password" minlength="8" required></label></p>
    <p><label>Confirm password<br><input name="confirm_password" type="password" minlength="8" required></label></p>
    <button type="submit">Create account</button>
  </form>
  <p><a href="login.html">Already have an account? Log in</a></p>
  <script src="js/teyvat-db.js"></script>
  <script src="js/teyvat-app.js"></script>
</body>
</html>
